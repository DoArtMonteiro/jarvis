# JARVIS Core configuration. Relative paths are resolved against the
# directory that contains this file.

database = "../var/jarvis.db"

[worker]
# Started directly, never through a shell, with an empty environment apart
# from PATH and SYSTEMROOT; there is no option to add variables back.
# The worker runs isolated by the OS (an AppContainer on Windows, Landlock
# and seccomp on Linux): it can read the interpreter's directory and `cwd`
# (plus the system runtime directories on Linux) and nothing else, and has
# no network and no child processes. The Core checks this with a probe at
# start-up (the network check covers loopback only) and refuses to run a
# worker if a check fails; `jarvis-core isolation check` runs the same check
# on demand.
# On Windows use the real interpreter ("python", or its full path), not the
# "py" launcher or a virtual environment: both start a second process.
program = "python3"
args = ["-m", "jarvis_worker"]
cwd = "../services/intelligence-python/src"
handshake_timeout_ms = 5000
memory_limit_mb = 512

[fixtures]
# The only directory filesystem.read_fixture can read from.
root = "../tests/fixtures/files"
max_bytes = 16384

[workspace]
# The only directory workspace.write_file can write into. Created if missing.
root = "../var/workspace"
max_bytes = 16384

[limits]
max_frame_bytes = 65536
tool_timeout_ms = 5000
write_timeout_ms = 5000
max_requests_per_session = 1000
max_protocol_errors = 16
# How often a job may be claimed. A job whose worker or Core stopped goes back
# to the queue until this many attempts are spent, then ends as interrupted.
max_job_attempts = 3
shutdown_grace_ms = 2000

[approvals]
# How long a person has to decide on a request before it expires.
ttl_ms = 300000

[supervisor]
# At most `restart_budget` worker restarts within `restart_window_ms`; after
# that the Core stops restarting the worker and reports itself unhealthy.
restart_budget = 5
restart_window_ms = 300000
backoff_initial_ms = 500
backoff_max_ms = 30000
# Longest a job may run, including time spent waiting for approvals.
job_timeout_ms = 600000

[rpc]
# Unix: a socket in a directory only this user can enter (created with mode
# 0700). Windows: a named pipe that refuses remote clients.
socket = "../var/rpc/jarvis.sock"
pipe = "jarvis"
# Lets `jarvis-core shutdown` stop the Core. Off by default.
allow_shutdown = true

[governor]
# Off by default. When on, the Core does not start queued jobs while one of
# the listed processes is running. Jobs that already run are left alone, and
# nothing about the game is touched: only the system's process list is read.
# Right after start-up jobs wait for the first check.
enabled = false
# Executable names, compared ignoring ASCII case; 1 to 16 names of up to 64
# printable ASCII characters, no `/` or `\`. On Linux the kernel keeps only
# the first 15 bytes of a process name, so list the name as `ps` shows it.
processes = ["cs2.exe"]
# How often the process list is read (250 to 60000). Each read costs CPU in
# proportion to the number of processes on the machine (see ADR 0016).
poll_ms = 5000
# How long the list must stay clear before queued jobs start again (0 to
# 600000).
resume_delay_ms = 30000
# A hold longer than this is reported as overdue in `health` and the audit
# log (60000 to 86400000). Jobs keep waiting: time alone never ends a hold.
alert_after_ms = 14400000

# Capabilities not listed here are denied.
# Decisions: "allow", "require_confirmation", "deny".
# Class B capabilities (workspace.write) cannot be set to "allow".
[policy]
"system.info" = "allow"
"filesystem.read.fixture" = "allow"
"workspace.write" = "require_confirmation"
# The Session Agent's synthetic health check (ADR 0019); class B. Desktop
# capabilities ("desktop.screen.observe", "desktop.clipboard.read",
# "desktop.clipboard.write", "desktop.input.send") can only be "deny".
"session_agent.healthcheck" = "require_confirmation"
