[package]
name = "donna"
version = "0.1.0"
description = "Donna, a desktop chat client for the JARVIS Core"
edition = "2024"
rust-version = "1.89"
publish = false

[lib]
name = "donna_lib"
crate-type = ["rlib"]

[[bin]]
name = "donna"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jarvis-core = { path = "../../../crates/jarvis-core" }
jarvis-protocol = { path = "../../../crates/jarvis-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
